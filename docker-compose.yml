# docker-compose.yml — поднимает всю систему одной командой:
#   docker compose up -d --build
#
# Структура:
#   sbertech-support/
#   ├── docker-compose.yml
#   ├── backend/  (Dockerfile, requirements.txt, main.py, .env, ...)
#   ├── frontend/ (Dockerfile, package.json, src/...)
#   └── nginx/    (nginx.conf)

services:
  backend:
    build:
      context: ./backend
    container_name: sbertech-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/data
    networks:
      - sbertech-net

  frontend:
    build:
      context: ./frontend
    container_name: sbertech-frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/usr/share/nginx/html
    networks:
      - sbertech-net

  nginx:
    image: nginx:1.27-alpine
    container_name: sbertech-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - sbertech-net

networks:
  sbertech-net:
    driver: bridge

volumes:
  backend_data:
  frontend_dist:
