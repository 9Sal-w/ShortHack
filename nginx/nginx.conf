# Сохраните как "nginx.conf" в папке nginx/.

server {
    listen 80;
    server_name support.sbertech.internal;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}

# Эндпоинты backend'а (backend/main.py):
#   POST /api/auth
#   GET  /api/tickets
#   POST /api/chat/start
#   POST /api/chat/{session_id}/messages
#   GET  /api/chat/{session_id}/messages
#   GET  /api/tickets/{id}/messages
#   POST /api/tickets/{id}/messages
#   POST /api/rewrite-style
#   GET  /api/health
